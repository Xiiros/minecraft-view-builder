[workspace]
resolver = "3"
members = ["crates/mvb-core", "crates/mvb-app", "tools/colorgen", "tools/icongen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alexis Meyer"]
repository = "https://github.com/Xiiros/minecraft-view-builder"

[workspace.dependencies]
mvb-core = { path = "crates/mvb-core" }
cesu8 = "1.1.0"
eframe = "0.36.2"
flate2 = "1.1.10"
glam = "0.34.1"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.14.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds favour speed and binary size over compile time.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Dependencies (wgpu, egui...) are optimized even in debug builds so the app stays usable while developing.
[profile.dev.package."*"]
opt-level = 2
